<!DOCTYPE html>

<!-- Estructura HTML-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investigación Individual 2</title>

     <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <header class="titulo-principal">
      <h1>Investigacion API Hoteles</h1>
    </header>
    
       <!-- Menu -->
    <nav class="menu-principal">
      <ul id="menu"></ul>
    </nav>

        <!-- Contenido principal. -->
    <main class="contenido">
      <section class="tarjeta">
        <!-- Titulo de la tarjeta: cambia segun la accion seleccionada. -->
        <div class="tarjeta-titulo" id="tituloTarjeta">Crear hoteles</div>

        <div class="tarjeta-cuerpo">
          <!-- Mensajes de respuesta de la aplicacion y de la API. -->
          <div class="mensaje oculto" id="mensaje"></div>

          <!-- Formulario dinamico para registrar o actualizar. -->
          <form id="formulario" novalidate></form>

          <!-- Botones del formulario. -->
          <div class="acciones-formulario" id="accionesFormulario">
            <button class="btn btn-primary" type="button" id="btnCrear">Guardar</button>
            <button class="btn btn-primary oculto" type="button" id="btnActualizar">Actualizar</button>
            <button class="btn btn-secondary" type="button" id="btnLimpiar">Limpiar</button>
          </div>

          <!-- Zona para consultar registros y mostrarlos en tabla. -->
          <div class="consulta oculto" id="zonaConsulta">
            <button class="btn btn-primary mb-3" type="button" id="btnConsultar">
              Consultar
            </button>

            <div class="table-responsive">
              <table class="table table-bordered table-hover">
                <thead id="tablaEncabezado"></thead>
                <tbody id="tablaCuerpo"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Pie de pagina. -->
    <footer class="pie-pagina">
        Elaborado por Wil, 2026
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
